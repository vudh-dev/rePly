name: Build test packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - {os: macos-latest, target: darwin-arm64}
          - {os: macos-latest, target: darwin-x64}
          - {os: windows-latest, target: win32-x64}
          - {os: ubuntu-latest, target: linux-x64}
          - {os: ubuntu-latest, target: linux-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/package.cjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: rePly-${{ matrix.target }}
          path: release/*

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dcd8cc"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".13"/></filter></defs>
<rect width="1600" height="920" fill="#f3f0e7"/>
<rect x="65" y="60" width="60" height="60" rx="18" fill="#193e32"/><text x="95" y="101" fill="#fff" text-anchor="middle" font-family="Georgia" font-size="32">re</text>
<text x="145" y="101" fill="#193e32" font-family="Georgia,serif" font-size="36">rePly</text>
<text x="72" y="260" fill="#183c31" font-family="Georgia,serif" font-size="82">A notebook</text><text x="72" y="350" fill="#183c31" font-family="Georgia,serif" font-size="82">that writes back.</text>
<text x="76" y="421" fill="#5b635a" font-family="Arial,sans-serif" font-size="25">A patient teacher,</text><text x="76" y="459" fill="#5b635a" font-family="Arial,sans-serif" font-size="25">right on the page.</text>
<g font-family="Arial,sans-serif" font-size="23" fill="#183c31"><circle cx="91" cy="555" r="19" fill="#dce4d8"/><text x="91" y="563" text-anchor="middle">1</text><text x="127" y="563">Write a question</text><circle cx="91" cy="620" r="19" fill="#dce4d8"/><text x="91" y="628" text-anchor="middle">2</text><text x="127" y="628">Zigzag &amp; lift your pen</text><circle cx="91" cy="685" r="19" fill="#dce4d8"/><text x="91" y="693" text-anchor="middle">3</text><text x="127" y="693">Watch the answer appear</text></g>
<rect x="74" y="770" width="565" height="54" rx="27" fill="#e4e6da"/><text x="356" y="805" text-anchor="middle" fill="#365244" font-family="Arial,sans-serif" font-size="19">reMarkable Paper Pro  ·  OpenAI or Claude</text>
<g filter="url(#shadow)"><rect x="800" y="65" width="680" height="790" rx="32" fill="#c9c7be"/><rect x="833" y="84" width="625" height="746" rx="14" fill="#fffdf6"/><rect x="833" y="84" width="625" height="746" rx="14" fill="url(#paper)"/></g>
<g fill="#242d26" font-family="Caveat, cursive" font-size="39"><text x="881" y="172">Solve 2x + 7 = 19</text><path d="M 884 212 l 20 -17 -4 28 24 -18 -3 29 23 -18" fill="none" stroke="#242d26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="881" y="310">Subtract 7 from both sides:</text><text x="906" y="371">2x = 12</text><text x="881" y="461">Divide both sides by 2:</text><text x="906" y="523">x = 6</text><path d="M 902 538 q 62 6 109 -1" fill="none" stroke="#242d26" stroke-width="3"/><text x="881" y="642">Check: 2(6) + 7 = 19</text></g>
<text x="76" y="882" fill="#73796e" font-family="Arial,sans-serif" font-size="15">Open-source • Desktop USB setup • Editable ink     /     Illustrated example; not a device screenshot.</text>
